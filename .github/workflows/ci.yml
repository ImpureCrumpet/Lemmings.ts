name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validation:
    name: Required validation (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:ci

      - name: Preserve test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Type-check
        run: npm run typecheck

      - name: Verify dependency license inventory
        run: npm run licenses:check

      - name: Build production bundle
        run: npm run build

      - name: Audit release contents
        run: node scripts/audit-release.mjs dist
